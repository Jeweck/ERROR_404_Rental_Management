<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="685667950_851931460606770_7624076952502804008_n-removebg-preview.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details - Rental Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            gap: 16px;
            width: 100vw;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
        }

        .sidebar-dashboard { z-index: 50; }
        .dashboard-content { margin-top: 60px; }

        .notification-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #333;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .user-profile-name { font-size: 13px; font-weight: 600; color: #333; }
        .user-profile-email { font-size: 11px; color: #888; }
    </style>
</head>
<body class="dashboard-body">

<script>
    // Auth guard — runs before anything renders
    (function () {
        const userData = JSON.parse(localStorage.getItem('userData'));
        if (!userData) {
            window.location.href = 'index.html';
        } else if (userData.role === 'tenant') {
            window.location.href = 'dashboard.html';
        }
    })();
</script>

<div class="dashboard-container">

    <!-- Main Content -->
    <main class="dashboard-content">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="user-profile">
                <div id="userAvatar" style="width:32px;height:32px;border-radius:50%;background:#2C96CD;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:0.03em;"></div>
                <div class="user-profile-info">
                    <div class="user-profile-name" id="userProfileName">User Name</div>
                    <div class="user-profile-email" id="userProfileEmail">user@email.com</div>
                </div>
            </div>
        </header>

        <!-- Room Details Body -->
        <div class="dashboard-body-content">
            <div class="room-details-wrapper">
                <div class="rooms-list">
                    <div class="rooms-container" id="roomsContainer"></div>
                </div>
                <div class="room-details-container" id="roomDetailsContainer" style="display:none;"></div>
            </div>
            <div class="add-room-container">
                <button class="btn btn-add-room" onclick="openAddRoomForm()">+ Add Room</button>
            </div>
        </div>
    </main>
</div>

<!-- dashboard.js handles: loadUserProfile, navigation, logout, role restrictions -->
<script src="dashboard.js"></script>
<script type="module" src="room-details.js"></script>
<script src="sidebar.js"></script>

</body>
</html>
