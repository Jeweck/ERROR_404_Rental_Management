<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="685667950_851931460606770_7624076952502804008_n-removebg-preview.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment and Billing - Rental Management</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; }

        .dashboard-header {
            display: flex; align-items: center; justify-content: flex-end;
            padding: 14px 24px; background: #fff; border-bottom: 1px solid #f0f0f0;
            gap: 16px; width: 100vw; box-sizing: border-box;
            position: fixed; top: 0; left: 0; right: 0; z-index: 40;
        }

        .sidebar-dashboard { z-index: 50; }

        .main-dashboard {
            margin-top: 60px;
            min-height: calc(100vh - 60px);
            background: #f0f2f5;
        }

        .notification-btn {
            background: none; border: none; cursor: pointer;
            font-size: 18px; color: #333; padding: 4px; display: flex; align-items: center;
        }

        .user-profile { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .user-profile-info { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
        .user-profile-name { font-size: 13px; font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .user-profile-email { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }

        /* ── Page wrapper ── */
        .payment-page-body {
            padding: 28px 28px 100px;
            width: 100%;
        }

        /* ── Page header ── */
        .payment-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .payment-page-title {
            font-size: 22px; font-weight: 700; color: #1a1a1a;
            display: flex; align-items: center; gap: 10px;
        }

        .receipts-count-badge { font-size: 13px; font-weight: 400; color: #888; }

        /* ── Empty state ── */
        .empty-state-wrap {
            display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 20px; color: #ccc; text-align: center;
        }
        .empty-state-wrap i { font-size: 52px; margin-bottom: 14px; }
        .empty-state-wrap p { font-size: 15px; color: #bbb; margin: 0; }

        /* ── Loading ── */
        .loading-wrap {
            display: flex; align-items: center; justify-content: center;
            padding: 60px 20px; color: #aaa; font-size: 14px; gap: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fa-spin { animation: spin 0.8s linear infinite; }

        /* ── Receipts list — full width ── */
        .receipts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* ── Receipt card — full width ── */
        .receipt-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.25s ease;
            transition: box-shadow 0.2s;
        }
        .receipt-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }

        @keyframes fadeIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(8px); } }

        .receipt-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }

        .receipt-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: #e8f5fd; color: #2C96CD;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }

        .receipt-info { flex: 1; min-width: 0; }
        .receipt-desc { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .receipt-meta { font-size: 12px; color: #888; }

        .receipt-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }

        .receipt-amount { font-size: 17px; font-weight: 700; color: #1a1a1a; }

        .receipt-badge {
            font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 600;
        }
        .badge-paid    { background: #dcfce7; color: #16a34a; }
        .badge-pending { background: #fef3c7; color: #d97706; }

        /* ── Action menu ── */
        .action-menu { position: relative; }
        .menu-btn {
            background: none; border: 1px solid #e8e8e8; cursor: pointer; color: #888;
            font-size: 13px; padding: 6px 10px; border-radius: 7px; transition: all 0.15s;
        }
        .menu-btn:hover { background: #f0f8fd; color: #2C96CD; border-color: #2C96CD; }

        .dropdown-menu {
            display: none; position: absolute; right: 0; top: calc(100% + 4px);
            background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 10;
            min-width: 120px; overflow: hidden;
        }
        .dropdown-menu.show { display: block; }

        .menu-item {
            width: 100%; padding: 9px 14px; background: none; border: none;
            cursor: pointer; font-size: 13px; display: flex; align-items: center;
            gap: 8px; color: #333; transition: background 0.15s;
        }
        .menu-item:hover { background: #f9fafb; }
        .delete-btn { color: #ef4444; }
        .delete-btn:hover { background: #fef2f2; }

        .hidden-for-tenant { display: none !important; }

        /* ── Floating btn container — bottom right ── */
        .floating-btn-container {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 50;
        }

        .floating-btn {
            background: #2C96CD; color: #fff; border: none; border-radius: 8px;
            padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            box-shadow: 0 2px 8px rgba(44,150,205,0.25);
            transition: background 0.15s;
        }
        .floating-btn:hover { background: #1e7aab; }
        .floating-btn:active { background: #1a6a96; }

        /* ── Add/Edit Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
            align-items: center; justify-content: center; z-index: 200;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: #fff; border-radius: 16px; padding: 28px; width: 400px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto;
        }
        .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #1a1a1a; }

        .modal label { font-size: 12px; color: #777; display: block; margin-bottom: 5px; margin-top: 14px; font-weight: 600; }

        .modal input, .modal select {
            width: 100%; padding: 9px 12px; border: 1.5px solid #e5e7eb;
            border-radius: 8px; font-size: 14px; color: #222; outline: none;
            transition: border 0.2s; font-family: inherit;
        }
        .modal input:focus, .modal select:focus { border-color: #2C96CD; }

        .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .modal-actions button {
            flex: 1; padding: 10px; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; border: none; transition: background 0.2s; font-family: inherit;
        }
        .btn-cancel { background: #f3f4f6; color: #555; }
        .btn-cancel:hover { background: #e5e7eb; }
        .btn-save { background: #2C96CD; color: #fff; }
        .btn-save:hover { background: #1e7aa8; }
        .btn-save:disabled { background: #a0c8e0; cursor: not-allowed; }

        /* ── Landlord modal ── */
        .landlord-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
            align-items: center; justify-content: center; z-index: 200;
        }
        .landlord-modal.open { display: flex; }

        .landlord-card {
            background: #fff; border-radius: 16px; padding: 32px; width: 100%;
            max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,0.15); position: relative;
        }
        .landlord-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: #1e1b4b; text-align: center; }

        .payment-method-btn {
            width: 100%; padding: 14px; margin-bottom: 12px; border: 2px solid #e5e7eb;
            background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px;
            font-weight: 600; color: #333; display: flex; align-items: center; gap: 10px; transition: all 0.2s;
        }
        .payment-method-btn:hover { border-color: #2C96CD; background: #f0f7ff; }
        .payment-method-btn.active { border-color: #2C96CD; background: #2C96CD; color: #fff; }

        .landlord-details {
            background: #f9fafb; padding: 16px; border-radius: 8px; margin-top: 16px; display: none;
        }
        .landlord-details.show { display: block; }

        .detail-row {
            display: flex; justify-content: space-between; padding: 8px 0;
            border-bottom: 1px solid #e5e7eb; font-size: 13px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #888; font-weight: 600; }
        .detail-value { color: #333; font-weight: 600; }

        .copy-btn {
            background: #2C96CD; color: #fff; border: none; border-radius: 6px;
            padding: 8px 12px; font-size: 12px; cursor: pointer; margin-top: 12px; width: 100%;
        }
        .copy-btn:hover { background: #1e7aab; }

        .close-landlord-btn {
            position: absolute; top: 12px; right: 12px; background: none;
            border: none; font-size: 24px; cursor: pointer; color: #999;
        }
        .close-landlord-btn:hover { color: #333; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 90px; right: 32px; background: #333; color: #fff;
            padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 300;
            opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #16a34a; }
        .toast.error   { background: #ef4444; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar-dashboard">
        <div class="sidebar-top">
            <div class="current-page-pill">Payment</div>
        </div>
        <nav class="nav-menu">
            <button class="nav-btn" id="dashboard-btn"><i class="fas fa-chart-line"></i> Dashboard</button>
            <button class="nav-btn" id="tenants-btn"><i class="fas fa-users"></i> Tenants</button>
            <button class="nav-btn" id="room-details-btn"><i class="fas fa-home"></i> Room Details</button>
            <button class="nav-btn active" id="payment-btn"><i class="fas fa-credit-card"></i> Payment</button>
            <button class="nav-btn" id="settings-btn"><i class="fas fa-cog"></i> Settings</button>
        </nav>
        <div class="sidebar-bottom">
            <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>

    <!-- Header -->
    <header class="dashboard-header">
        <button class="notification-btn"><i class="fas fa-bell"></i></button>
        <div class="user-profile">
    <div id="userAvatar" style="width:32px;height:32px;border-radius:50%;background:#2C96CD;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:0.03em;"></div>
    <div class="user-profile-info">
                <div class="user-profile-name" id="userProfileName">User Name</div>
                <div class="user-profile-email" id="userProfileEmail">user@email.com</div>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <div class="main-dashboard">
        <div class="payment-page-body">

            <!-- Page header -->
            <div class="payment-page-header">
                <div class="payment-page-title">
                    Receipts
                    <span class="receipts-count-badge" id="receiptsCountBadge"></span>
                </div>
            </div>

            <!-- Loading -->
            <div class="loading-wrap" id="loading-wrap">
                <i class="fas fa-spinner fa-spin"></i> Loading receipts…
            </div>

            <!-- Empty state -->
            <div class="empty-state-wrap" id="empty-wrap">
                <i class="fas fa-receipt"></i>
                <p>No receipts yet. Click <strong>+ Add Receipt</strong> to get started.</p>
            </div>

            <!-- Receipts list — full width -->
            <div class="receipts-list" id="receipts-list"></div>

        </div>
    </div>

    <!-- Floating button -->
    <div class="floating-btn-container">
        <button class="floating-btn" id="add-receipt-btn">
            <i class="fas fa-plus"></i> Add Receipt
        </button>
    </div>
</div>

<!-- Add / Edit Receipt Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h3 id="modal-title">Add Receipt</h3>
        <label>Tenant Name</label>
        <input type="text" id="tenant-name" placeholder="e.g. Juan Dela Cruz">
        <label>Amount (₱)</label>
        <input type="number" id="amount" placeholder="e.g. 5000">
        <label>Description</label>
        <input type="text" id="description" placeholder="e.g. Monthly Rent - June">
        <label>Status</label>
        <select id="status">
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
        </select>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancel-btn">Cancel</button>
            <button class="btn-save" id="save-btn">Save</button>
        </div>
    </div>
</div>

<!-- Landlord Payment Details Modal (Tenant Only) -->
<div class="landlord-modal" id="landlordModal">
    <div class="landlord-card">
        <button class="close-landlord-btn" id="closeLandlordModal">&times;</button>
        <h3>Payment Methods</h3>
        <button class="payment-method-btn active" onclick="selectPaymentMethod(event, 'gcash')">
            <i class="fas fa-mobile-alt"></i> GCash
        </button>
        <button class="payment-method-btn" onclick="selectPaymentMethod(event, 'banktransfer')">
            <i class="fas fa-university"></i> Bank Transfer
        </button>
        <div class="landlord-details show" id="gcashDetails">
            <div class="detail-row">
                <span class="detail-label">Landlord Name:</span>
                <span class="detail-value" id="gcashName">Maria Santos</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">GCash Number:</span>
                <span class="detail-value" id="gcashNumber">09171234567</span>
            </div>
            <button class="copy-btn" onclick="copyToClipboard('gcashNumber')">Copy Number</button>
        </div>
        <div class="landlord-details" id="bankDetails">
            <div class="detail-row">
                <span class="detail-label">Landlord Name:</span>
                <span class="detail-value" id="bankName">Maria Santos</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Bank Name:</span>
                <span class="detail-value" id="bankBankName">BPI</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Account Number:</span>
                <span class="detail-value" id="bankAccount">1234567890</span>
            </div>
            <button class="copy-btn" onclick="copyToClipboard('bankAccount')">Copy Account Number</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ── Firebase Init ────────────────────────────────────────────────────────────
const firebaseConfig = {
    apiKey:            "AIzaSyAGd7Aaiu_d-VIokG16gapCZOlpGheb9tY",
    authDomain:        "rentalmangemnetsystem.firebaseapp.com",
    projectId:         "rentalmangemnetsystem",
    storageBucket:     "rentalmangemnetsystem.firebasestorage.app",
    messagingSenderId: "143952534193",
    appId:             "1:143952534193:web:1a0dc97e5e0f10fde16090",
    measurementId:     "G-8HXJE3259V"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db          = firebase.firestore();
const receiptsCol = db.collection('receipts');

// ── State ────────────────────────────────────────────────────────────────────
let userRole  = 'landlord';
let editingId = null;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const addBtn        = document.getElementById('add-receipt-btn');
const modal         = document.getElementById('modal');
const cancelBtn     = document.getElementById('cancel-btn');
const saveBtn       = document.getElementById('save-btn');
const list          = document.getElementById('receipts-list');
const emptyWrap     = document.getElementById('empty-wrap');
const loadingWrap   = document.getElementById('loading-wrap');
const landlordModal = document.getElementById('landlordModal');

// ── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 3000);
}

// ── Update count badge ───────────────────────────────────────────────────────
function updateCountBadge() {
    const count = list.children.length;
    const badge = document.getElementById('receiptsCountBadge');
    if (badge) badge.textContent = count + ' receipt' + (count !== 1 ? 's' : '');
}

// ── Load user profile ────────────────────────────────────────────────────────
function loadUserProfile() {
    const userData = JSON.parse(localStorage.getItem('userData'));
    if (userData) {
        userRole = userData.role || 'landlord';
        document.getElementById('userProfileName').textContent  = userData.username || userData.name || 'User Name';
        document.getElementById('userProfileEmail').textContent = userData.email || 'user@email.com';
        const nameParts = (userData.name || '').trim().split(' ').filter(Boolean);
let initials = '';
if (nameParts.length >= 2) {
    initials = (nameParts[0][0] + nameParts[nameParts.length - 1][0]).toUpperCase();
} else if (userData.email) {
    const emailUser = userData.email.split('@')[0].replace(/[0-9]/g, '');
    const emailParts = emailUser.match(/[a-z]+/gi) || [];
    initials = emailParts.length >= 2
        ? (emailParts[0][0] + emailParts[1][0]).toUpperCase()
        : emailUser.slice(0, 2).toUpperCase();
} else {
    initials = (userData.name || 'U').slice(0, 2).toUpperCase();
}
document.getElementById('userAvatar').textContent = initials;

        if (userRole === 'tenant') {
            // Swap Add Receipt button for Pay Now
            const floatingContainer = document.querySelector('.floating-btn-container');
            if (floatingContainer) {
                floatingContainer.innerHTML = `
                    <button class="floating-btn" id="view-landlord-btn">
                        <i class="fas fa-building"></i> Pay Now
                    </button>`;
                document.getElementById('view-landlord-btn')
                    .addEventListener('click', () => landlordModal.classList.add('open'));
            }

            document.getElementById('tenants-btn').style.display      = 'none';
            document.getElementById('room-details-btn').style.display = 'none';
        }
    }
}

// ── Render a single receipt card ─────────────────────────────────────────────
function renderReceipt(docId, data, prepend = true) {
    if (document.querySelector(`[data-receipt-id="${docId}"]`)) return;

    const card       = document.createElement('div');
    card.className   = 'receipt-card';
    card.setAttribute('data-receipt-id', docId);

    const amount     = parseFloat(data.amount || 0).toLocaleString('en-PH', { minimumFractionDigits: 2 });
    const badgeClass = data.status === 'paid' ? 'badge-paid' : 'badge-pending';
    const badgeLabel = data.status === 'paid' ? 'Paid' : 'Pending';
    const isLandlord = userRole !== 'tenant';

    card.innerHTML = `
        <div class="receipt-left">
            <div class="receipt-icon">
                <i class="fas fa-receipt"></i>
            </div>
            <div class="receipt-info">
                <div class="receipt-desc">${data.description || 'Receipt'}</div>
                <div class="receipt-meta">${data.name || '—'} · ${data.date || '—'}</div>
            </div>
        </div>
        <div class="receipt-right">
            <span class="receipt-badge ${badgeClass}">${badgeLabel}</span>
            <div class="receipt-amount">₱${amount}</div>
            <div class="action-menu ${isLandlord ? '' : 'hidden-for-tenant'}">
                <button class="menu-btn" onclick="togglePaymentMenu(event)">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
                <div class="dropdown-menu">
                    <button class="menu-item" onclick="openEditModal(event)">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button class="menu-item delete-btn" onclick="deleteReceipt(event)">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>`;

    if (prepend) list.prepend(card); else list.appendChild(card);
    updateCountBadge();
}

// ── Load all receipts ────────────────────────────────────────────────────────
async function loadReceipts() {
    loadingWrap.style.display = 'flex';
    emptyWrap.style.display   = 'none';
    list.innerHTML            = '';

    try {
        const snapshot = await receiptsCol.orderBy('createdAt', 'desc').get();
        loadingWrap.style.display = 'none';

        if (snapshot.empty) {
            emptyWrap.style.display = 'flex';
            return;
        }

        snapshot.forEach(doc => renderReceipt(doc.id, doc.data(), false));

    } catch (err) {
        loadingWrap.style.display = 'none';
        emptyWrap.style.display   = 'flex';
        console.error('Firestore load error:', err);
        showToast('Failed to load receipts.', 'error');
    }
}

// ── Open Add modal ───────────────────────────────────────────────────────────
addBtn.addEventListener('click', () => {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Add Receipt';
    document.getElementById('tenant-name').value  = '';
    document.getElementById('amount').value        = '';
    document.getElementById('description').value  = '';
    document.getElementById('status').value        = 'paid';
    modal.classList.add('open');
});

cancelBtn.addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

// ── Open Edit modal ──────────────────────────────────────────────────────────
function openEditModal(event) {
    event.preventDefault();
    const card = event.currentTarget.closest('.receipt-card');
    editingId  = card.getAttribute('data-receipt-id');

    document.getElementById('modal-title').textContent = 'Edit Receipt';
    document.getElementById('tenant-name').value  = card.querySelector('.receipt-meta').textContent.split(' · ')[0].trim();
    document.getElementById('amount').value        = card.querySelector('.receipt-amount').textContent.replace('₱', '').replace(/,/g, '');
    document.getElementById('description').value  = card.querySelector('.receipt-desc').textContent;
    document.getElementById('status').value        = card.querySelector('.receipt-badge').classList.contains('badge-paid') ? 'paid' : 'pending';

    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
    modal.classList.add('open');
}

// ── Save (add or update) ─────────────────────────────────────────────────────
saveBtn.addEventListener('click', async () => {
    const name   = document.getElementById('tenant-name').value.trim();
    const amount = document.getElementById('amount').value.trim();
    const desc   = document.getElementById('description').value.trim() || 'Receipt';
    const status = document.getElementById('status').value;

    if (!name || !amount) {
        showToast('Please fill in Tenant Name and Amount.', 'error');
        return;
    }

    saveBtn.disabled    = true;
    saveBtn.textContent = 'Saving…';

    const now = new Date().toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });

    try {
        if (editingId) {
            // UPDATE
            await receiptsCol.doc(editingId).update({ name, amount, description: desc, status, date: now });

            const card = document.querySelector(`[data-receipt-id="${editingId}"]`);
            if (card) {
                card.querySelector('.receipt-desc').textContent = desc;
                card.querySelector('.receipt-meta').textContent = `${name} · ${now}`;
                const badge = card.querySelector('.receipt-badge');
                badge.className   = `receipt-badge ${status === 'paid' ? 'badge-paid' : 'badge-pending'}`;
                badge.textContent = status === 'paid' ? 'Paid' : 'Pending';
                card.querySelector('.receipt-amount').textContent =
                    '₱' + parseFloat(amount).toLocaleString('en-PH', { minimumFractionDigits: 2 });
            }
            showToast('Receipt updated!', 'success');

        } else {
            // ADD
            const docRef = await receiptsCol.add({
                name, amount, description: desc, status, date: now,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            emptyWrap.style.display = 'none';
            renderReceipt(docRef.id, { name, amount, description: desc, status, date: now });
            showToast('Receipt added!', 'success');
        }

        modal.classList.remove('open');

    } catch (err) {
        console.error('Firestore save error:', err);
        showToast('Failed to save receipt.', 'error');
    } finally {
        saveBtn.disabled    = false;
        saveBtn.textContent = 'Save';
    }
});

// ── Delete ───────────────────────────────────────────────────────────────────
async function deleteReceipt(event) {
    event.preventDefault();
    const card       = event.currentTarget.closest('.receipt-card');
    const docId      = card.getAttribute('data-receipt-id');
    const tenantName = card.querySelector('.receipt-meta').textContent.split(' · ')[0].trim();

    if (!confirm(`Delete ${tenantName}'s receipt?`)) return;

    card.style.animation = 'fadeOut 0.3s ease forwards';
    setTimeout(async () => {
        try {
            await receiptsCol.doc(docId).delete();
            card.remove();
            updateCountBadge();
            if (list.children.length === 0) emptyWrap.style.display = 'flex';
            showToast('Receipt deleted.', 'success');
        } catch (err) {
            console.error('Firestore delete error:', err);
            showToast('Failed to delete receipt.', 'error');
            card.style.animation = '';
        }
    }, 300);
}

// ── Dropdown toggle ──────────────────────────────────────────────────────────
function togglePaymentMenu(event) {
    event.preventDefault();
    event.stopPropagation();
    const menu = event.currentTarget.nextElementSibling;
    document.querySelectorAll('.dropdown-menu').forEach(m => { if (m !== menu) m.classList.remove('show'); });
    menu.classList.toggle('show');
}

document.addEventListener('click', e => {
    if (!e.target.closest('.action-menu'))
        document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
});

// ── Landlord modal ───────────────────────────────────────────────────────────
document.getElementById('closeLandlordModal').addEventListener('click', () => landlordModal.classList.remove('open'));
landlordModal.addEventListener('click', e => { if (e.target === landlordModal) landlordModal.classList.remove('open'); });

function selectPaymentMethod(event, method) {
    document.querySelectorAll('.payment-method-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.landlord-details').forEach(d => { d.style.display = 'none'; d.classList.remove('show'); });
    event.currentTarget.classList.add('active');
    const target = method === 'gcash' ? 'gcashDetails' : 'bankDetails';
    document.getElementById(target).style.display = 'block';
    document.getElementById(target).classList.add('show');
}

function copyToClipboard(elementId) {
    const text = document.getElementById(elementId).textContent;
    navigator.clipboard.writeText(text).then(() => showToast('Copied: ' + text, 'success'));
}

// ── Navigation ───────────────────────────────────────────────────────────────
document.getElementById('dashboard-btn')?.addEventListener('click',    () => window.location.href = 'dashboard.html');
document.getElementById('tenants-btn')?.addEventListener('click',      () => window.location.href = 'tenants.html');
document.getElementById('room-details-btn')?.addEventListener('click', () => window.location.href = 'room-details.html');
document.getElementById('settings-btn')?.addEventListener('click',     () => window.location.href = 'settings.html');

document.getElementById('logout-btn')?.addEventListener('click', () => {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('userData');
        localStorage.removeItem('rememberedEmail');
        window.location.href = 'index.html';
    }
});

// ── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    loadUserProfile();
    loadReceipts();
});
</script>
