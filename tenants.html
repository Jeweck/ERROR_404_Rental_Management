<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="685667950_851931460606770_7624076952502804008_n-removebg-preview.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants - Rental Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef0f3;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            gap: 16px;
            width: 100vw;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
        }

        .sidebar-dashboard {
            z-index: 50;
        }

        .notification-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #333;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .user-profile-name { font-size: 13px; font-weight: 600; color: #333; }
        .user-profile-email { font-size: 11px; color: #888; }

        .dashboard-content {
            margin-top: 60px;
        }

        .page-body {
            padding: 28px 28px 40px;
            background: #eef0f3;
            min-height: calc(100vh - 60px);
        }

        .tenants-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .tenants-page-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tenants-count-badge { font-size: 13px; font-weight: 400; color: #888; }

        .add-tenant-btn {
            background: #2C96CD;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background 0.15s;
            box-shadow: 0 2px 8px rgba(44,150,205,0.25);
        }

        .add-tenant-btn:hover { background: #1e7aab; }

        .stats-row-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 14px;
        }

        .stat-card-pending-row { margin-bottom: 20px; }

        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px 20px 16px;
            border: 1px solid #e8e8e8;
        }

        .stat-card-label { font-size: 12px; color: #999; margin-bottom: 10px; }
        .stat-card-value { font-size: 30px; font-weight: 700; line-height: 1; }
        .stat-neutral { color: #1a1a1a; }
        .stat-green   { color: #22c55e; }
        .stat-red     { color: #ef4444; }
        .stat-amber   { color: #f59e0b; }

        .tenants-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tenant-search-wrap { position: relative; flex: 1; min-width: 200px; }

        .tenant-search-wrap input {
            width: 100%;
            padding: 9px 12px 9px 34px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
            outline: none;
        }

        .tenant-search-wrap input:focus { border-color: #2C96CD; }

        .tenant-search-icon {
            position: absolute;
            left: 11px; top: 50%;
            transform: translateY(-50%);
            color: #bbb; font-size: 12px;
        }

        .tenants-filters select {
            padding: 9px 30px 9px 12px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
            cursor: pointer;
            outline: none;
        }

        .tenants-table-wrap {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e8e8e8;
            overflow: hidden;
        }

        .tenants-table { width: 100%; border-collapse: collapse; }

        .tenants-table th {
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #aaa;
            padding: 11px 16px;
            border-bottom: 1px solid #f0f0f0;
            background: #fafafa;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .tenants-table td {
            padding: 13px 16px;
            font-size: 13px;
            border-bottom: 1px solid #f5f5f5;
            color: #222;
            vertical-align: middle;
        }

        .tenants-table tr:last-child td { border-bottom: none; }
        .tenants-table tbody tr:hover td { background: #fafafa; }

        .tenant-name-cell { display: flex; align-items: center; gap: 10px; }

        .tenant-avatar-circle {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .tenant-name-text { font-weight: 600; font-size: 13px; color: #1a1a1a; }
        .tenant-contact-sub { font-size: 11px; color: #aaa; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-active  { background: #dcfce7; color: #16a34a; }
        .badge-overdue { background: #fee2e2; color: #dc2626; }
        .badge-pending { background: #fef3c7; color: #d97706; }

        .tenant-action-btns { display: flex; gap: 6px; }

        .t-icon-btn {
            background: none;
            border: 1px solid #e8e8e8;
            border-radius: 7px;
            width: 30px; height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            transition: all 0.15s;
        }

        .t-icon-btn:hover { background: #f0f8fd; color: #2C96CD; border-color: #2C96CD; }
        .t-icon-btn.btn-del:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

        .tenants-empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #bbb;
            font-size: 14px;
        }

        .t-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }

        .t-modal-overlay.open { display: flex; }

        .t-modal {
            background: #fff;
            border-radius: 14px;
            padding: 26px;
            width: 100%;
            max-width: 440px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .t-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .t-modal-title { font-size: 16px; font-weight: 700; color: #1a1a1a; }

        .t-close-btn {
            background: none; border: none;
            font-size: 18px; cursor: pointer;
            color: #bbb; line-height: 1;
        }

        .t-close-btn:hover { color: #555; }

        .t-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .t-form-group { margin-bottom: 14px; }

        .t-form-label {
            display: block;
            font-size: 12px; color: #777;
            margin-bottom: 5px; font-weight: 600;
        }

        .t-form-input,
        .t-form-select {
            width: 100%;
            padding: 9px 12px;
            font-size: 13px;
            border: 1px solid #e2e2e2;
            border-radius: 8px;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.15s;
        }

        .t-form-input:focus,
        .t-form-select:focus { border-color: #2C96CD; }

        .t-modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .t-cancel-btn {
            background: none;
            border: 1px solid #e2e2e2;
            border-radius: 8px;
            padding: 9px 20px;
            font-size: 13px;
            cursor: pointer;
            color: #555;
        }

        .t-cancel-btn:hover { background: #f5f5f5; }

        .t-save-btn {
            background: #2C96CD;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 22px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .t-save-btn:hover { background: #1e7aab; }

        .t-confirm-modal { max-width: 340px; text-align: center; }
        .t-confirm-icon { font-size: 34px; color: #2C96CD; margin-bottom: 12px; }
        .t-confirm-title { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
        .t-confirm-msg { font-size: 13px; color: #999; margin-bottom: 22px; line-height: 1.6; }

        .t-del-btn {
            background: #e5384a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 22px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .t-del-btn:hover { background: #c42a3c; }
    </style>
</head>

<body class="dashboard-body">
<script>
    (function () {
        try {
            const userData = JSON.parse(localStorage.getItem('userData'));
            if (!userData) {
                window.location.replace('index.html');
            } else if (userData.role === 'tenant') {
                window.location.replace('dashboard.html');
            }
        } catch (e) {
            window.location.replace('index.html');
        }
    })();
</script>

<div class="dashboard-container">

    <!-- Main Content -->
    <main class="dashboard-content">

        <!-- Header -->
        <header class="dashboard-header">
           <div class="user-profile">
    <div id="userAvatar" style="width:32px;height:32px;border-radius:50%;background:#2C96CD;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:0.03em;"></div>
    <div class="user-profile-info">
                    <div class="user-profile-name" id="userProfileName">User Name</div>
                    <div class="user-profile-email" id="userProfileEmail">user@email.com</div>
                </div>
            </div>
        </header>

        <!-- Page Body -->
        <div class="page-body">

            <!-- Page Header -->
            <div class="tenants-page-header">
                <div class="tenants-page-title">
                    Tenants
                    <span class="tenants-count-badge" id="tenantsCountBadge">0 tenants</span>
                </div>
                <button class="add-tenant-btn" id="addTenantBtn" onclick="openAddTenant()">
                    <i class="fas fa-plus"></i> Add Tenant
                </button>
            </div>

            <!-- Stats: top row -->
            <div class="stats-row-top">
                <div class="stat-card">
                    <div class="stat-card-label">Total Tenants</div>
                    <div class="stat-card-value stat-neutral" id="statTotal">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Active</div>
                    <div class="stat-card-value stat-green" id="statActive">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Overdue</div>
                    <div class="stat-card-value stat-red" id="statOverdue">0</div>
                </div>
            </div>

            <!-- Stats: Pending full-width -->
            <div class="stat-card-pending-row">
                <div class="stat-card">
                    <div class="stat-card-label">Pending</div>
                    <div class="stat-card-value stat-amber" id="statPending">0</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="tenants-filters">
                <div class="tenant-search-wrap">
                    <i class="fas fa-search tenant-search-icon"></i>
                    <input type="text" id="tenantSearchInput" placeholder="Search tenant name, room..." />
                </div>
                <select id="tenantStatusFilter">
                    <option value="">All Status</option>
                    <option value="Active">Active</option>
                    <option value="Overdue">Overdue</option>
                    <option value="Pending">Pending</option>
                </select>
                <select id="tenantSortBy">
                    <option value="name">Sort by Name</option>
                    <option value="room">Sort by Room</option>
                    <option value="rent">Sort by Rent</option>
                    <option value="due">Sort by Due Date</option>
                </select>
            </div>

            <!-- Tenants Table -->
            <div class="tenants-table-wrap">
                <table class="tenants-table" id="tenantsTable">
                    <thead>
                        <tr>
                            <th>Tenant</th>
                            <th>Room</th>
                            <th>Monthly Rent</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tenantsTableBody"></tbody>
                </table>
                <div class="tenants-empty-state" id="tenantsEmptyState">
                    <i class="fas fa-users" style="font-size:30px;margin-bottom:10px;display:block;"></i>
                    No tenants yet. Click <strong>+ Add Tenant</strong> to get started.
                </div>
            </div>

        </div><!-- end page-body -->
    </main>
</div><!-- end dashboard-container -->


<!-- Add / Edit Tenant Modal -->
<div class="t-modal-overlay" id="tenantFormModal">
    <div class="t-modal">
        <div class="t-modal-header">
            <div class="t-modal-title" id="tenantModalTitle">Add Tenant</div>
            <button class="t-close-btn" id="closeTenantFormModal">&#10005;</button>
        </div>

        <div class="t-form-row">
            <div class="t-form-group">
                <label class="t-form-label">First Name</label>
                <input class="t-form-input" id="tFirstName" placeholder="Juan" />
            </div>
            <div class="t-form-group">
                <label class="t-form-label">Last Name</label>
                <input class="t-form-input" id="tLastName" placeholder="dela Cruz" />
            </div>
        </div>

        <div class="t-form-row">
            <div class="t-form-group">
                <label class="t-form-label">Room Number</label>
                <input class="t-form-input" id="tRoom" placeholder="101" />
            </div>
            <div class="t-form-group">
                <label class="t-form-label">Monthly Rent (&#8369;)</label>
                <input class="t-form-input" type="number" id="tRent" placeholder="5000" />
            </div>
        </div>

        <div class="t-form-row">
            <div class="t-form-group">
                <label class="t-form-label">Move-in Date</label>
                <input class="t-form-input" type="date" id="tMoveIn" />
            </div>
            <div class="t-form-group">
                <label class="t-form-label">Due Day (1–28)</label>
                <input class="t-form-input" type="number" id="tDueDay" min="1" max="28" placeholder="1" />
            </div>
        </div>

        <div class="t-form-group">
            <label class="t-form-label">Contact Number</label>
            <input class="t-form-input" id="tContact" placeholder="09XX-XXX-XXXX" />
        </div>

        <div class="t-form-group">
            <label class="t-form-label">Status</label>
            <select class="t-form-select" id="tStatus">
                <option value="Active">Active</option>
                <option value="Pending">Pending</option>
                <option value="Overdue">Overdue</option>
            </select>
        </div>

        <div class="t-modal-footer">
            <button class="t-cancel-btn" id="cancelTenantForm">Cancel</button>
            <button class="t-save-btn" id="saveTenantBtn">Save Tenant</button>
        </div>
    </div>
</div>

<!-- Confirm Delete Modal -->
<div class="t-modal-overlay" id="tenantConfirmModal">
    <div class="t-modal t-confirm-modal">
        <div class="t-confirm-icon"><i class="fas fa-trash-alt"></i></div>
        <div class="t-confirm-title">Remove Tenant</div>
        <div class="t-confirm-msg" id="tenantConfirmMsg">Are you sure you want to remove this tenant?</div>
        <div style="display:flex;gap:10px;justify-content:center;">
            <button class="t-cancel-btn" id="cancelTenantDelete">Cancel</button>
            <button class="t-del-btn" id="confirmTenantDelete">Remove</button>
        </div>
    </div>
</div>

<script src="dashboard.js"></script>
<script>
    function loadUserProfile() {
        const userData = JSON.parse(localStorage.getItem('userData'));
        if (userData) {
            document.getElementById('userProfileName').textContent = userData.username || userData.name || 'User Name';
            document.getElementById('userProfileEmail').textContent = userData.email || 'user@email.com';
            const nameParts = (userData.name || '').trim().split(' ').filter(Boolean);

let initials = '';
if (nameParts.length >= 2) {
    initials = (nameParts[0][0] + nameParts[nameParts.length - 1][0]).toUpperCase();
} else if (userData.email) {
    const emailUser = userData.email.split('@')[0].replace(/[0-9]/g, '');
    const emailParts = emailUser.match(/[a-z]+/gi) || [];
    initials = emailParts.length >= 2
        ? (emailParts[0][0] + emailParts[1][0]).toUpperCase()
        : emailUser.slice(0, 2).toUpperCase();
} else {
    initials = (userData.name || 'U').slice(0, 2).toUpperCase();
}
document.getElementById('userAvatar').textContent = initials;
        }
    }

    document.addEventListener('DOMContentLoaded', loadUserProfile);
</script>
<script type="module" src="tenants.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
