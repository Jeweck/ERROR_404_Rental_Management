<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="685667950_851931460606770_7624076952502804008_n-removebg-preview.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Management System - Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal h2 {
            margin-bottom: 24px;
            color: #333;
            text-align: center;
        }

        .role-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e7eb;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .role-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: #fff;
        }

        .role-btn:hover {
            border-color: #667eea;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
        }

        .btn-register-modal {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-register-modal:hover {
            background: #5568d3;
        }

        .error-message {
            color: #c33;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-content">
                <h1 class="brand-title">
                    <span>RENTAL</span>
                    <span>MANAGE</span>
                    <span>MENT</span>
                    <span>SYSTEM</span>
                </h1>
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="form-section">
            <div class="form-container">
                <form id="loginForm">
                    <!-- Email Address Field -->
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="" 
                            required
                        >
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="" 
                            required
                        >
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="form-group checkbox-group">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            name="rememberMe"
                        >
                        <label for="rememberMe" class="checkbox-label">Remember me</label>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-login">Login</button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Register Button -->
                <button type="button" class="btn btn-register" id="registerBtn">Register</button>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2>Create Account</h2>

            <!-- Role Selection -->
            <div class="role-buttons">
                <button type="button" class="role-btn active" data-role="tenant">
                    Tenant
                </button>
                <button type="button" class="role-btn" data-role="landlord">
                    Landlord
                </button>
            </div>

            <form id="registerForm">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input 
                        type="text" 
                        id="regUsername" 
                        name="username" 
                        placeholder="Choose your username"
                        required
                    >
                    <div class="error-message" id="usernameError"></div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="regEmail">Email address</label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        name="email" 
                        placeholder="your@email.com"
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        name="password" 
                        placeholder="At least 6 characters"
                        required
                    >
                    <div class="error-message" id="passwordError"></div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="regConfirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password"
                        required
                    >
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn-register-modal">Register</button>
            </form>
        </div>
    </div>

    <script>
        let selectedRole = 'tenant';

        // Modal controls
        const registerBtn = document.getElementById('registerBtn');
        const closeModal = document.getElementById('closeModal');
        const registerModal = document.getElementById('registerModal');
        const roleButtons = document.querySelectorAll('.role-btn');

        registerBtn.addEventListener('click', () => {
            registerModal.classList.add('active');
        });

        closeModal.addEventListener('click', () => {
            registerModal.classList.remove('active');
        });

        registerModal.addEventListener('click', (e) => {
            if (e.target === registerModal) {
                registerModal.classList.remove('active');
            }
        });

        // Role selection
        roleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                roleButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRole = btn.dataset.role;
            });
        });

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Get stored credentials
            const storedUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
            const user = storedUsers.find(u => u.email === email && u.password === password);

            if (user) {
                // Save current user data
                localStorage.setItem('userData', JSON.stringify({
                    name: user.username,
                    email: user.email,
                    role: user.role
                }));

                if (rememberMe) {
                    localStorage.setItem('rememberedEmail', email);
                }

                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid email or password!');
            }
        });

        // Register Form Handler
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            // Clear errors
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });

            let isValid = true;

            // Validation
            if (username.length < 3) {
                document.getElementById('usernameError').textContent = 'Username must be at least 3 characters';
                document.getElementById('usernameError').classList.add('show');
                isValid = false;
            }

            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                document.getElementById('passwordError').classList.add('show');
                isValid = false;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                document.getElementById('confirmPasswordError').classList.add('show');
                isValid = false;
            }

            // Check if email already exists
            const allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
            if (allUsers.some(u => u.email === email)) {
                document.getElementById('emailError').textContent = 'Email already registered';
                document.getElementById('emailError').classList.add('show');
                isValid = false;
            }

            if (!isValid) return;

            // Save new user
            const newUser = {
                username: username,
                email: email,
                password: password,
                role: selectedRole
            };

            allUsers.push(newUser);
            localStorage.setItem('allUsers', JSON.stringify(allUsers));

            // Auto-login after registration
            localStorage.setItem('userData', JSON.stringify({
                name: username,
                email: email,
                role: selectedRole
            }));

            alert(`Welcome ${username}! Registration successful as ${selectedRole}`);
            registerModal.classList.remove('active');
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
